# Postgres for the benchmark harness only. The compose project name and the
# host port (5544) keep it apart from any other Postgres on the machine; the
# runner starts it, and stops it again if it was the one that started it.
# Data lives in tmpfs, so every `up` starts empty and disk noise stays out of
# the numbers.
name: quickdraw-bench

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickdraw_bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    ports:
      - "127.0.0.1:${BENCH_PG_PORT:-5544}:5432"
    # Pinned away from the cores the bench server and the load generator use.
    cpuset: "${BENCH_PG_CPUS:-6-9}"
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d quickdraw_bench"]
      interval: 2s
      timeout: 5s
      retries: 30
